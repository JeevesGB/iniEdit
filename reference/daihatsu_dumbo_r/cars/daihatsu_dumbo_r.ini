[car]
label = daihatsu_dumbo_r_89  ; unique id (a-z, 0-9, _). Garage, saves and replays use it: never change it once shared
name = daihatsu_dumbo_r          ; shown after the maker's name
maker = Daihatsu                   ; no disc dealer sells GT3R cars, so makers/gt3r.ini adds one
year = 1989                   ; the year the body was modelled
price = 300                ; credits: between the disc's ~280 PS coupes (Supra RZ 44,800) and a CLK55 (93,110)
category = production          ; a road car (race cars use other bodies and rules)
donor = z_detroitver_01        ; Nissan Z Concept: also a front-engined V6 rear-drive concept coupe of
                               ; similar size (4300 mm, 1320 kg). The donor lends suspension geometry,
                               ; steering, tyre compounds, brakes, aids and the shop's upgrade parts.

[body]
; Measured from models/daihatsu_dumbo_r.glb (scaled to 2.9 m long, ground at y = 0, centred on the wheelbase midpoint).
weight_kg = 900               ; curb weight: Hijet-based kei van (the game adds 120 kg of driver)
front_weight_pct = 50          ; cab-over: engine under the seats, close to even weight
length_mm = 2890
width_mm = 1535                ; without the mirrors (a real kei is 1,480 mm)
height_mm = 1620
wheelbase_mm = 2085            ; between the wheel centres of the model
front_track_mm = 1360          ; centre to centre of the modelled tyres
rear_track_mm = 1360
cd = 0.35                      ; tall boxy kei body
frontal_area_m2 = 2.00         ; about 0.82 x width x height
; ride_height_mm is left to the donor: the body below is drawn on its own ground line.

[powertrain]
type = engine
; A 660 cc turbocharged three-cylinder. Torque (N*m) at the crank; peak power
; = torque x rpm / 9549: 191 x 7000 / 9549 = 140 kW (190 PS), about 200 PS with output_pct 105.
curve = 1000:100 2000:140 3000:185 4000:200 5000:200 6000:197 7000:191 8000:165 9000:135 10000:105
max_rpm = 10000                ; rev limiter
idle_rpm = 850
output_pct = 105               ; GT3's hidden output factor (disc cars: mostly 100-120),
                               ; fitted with `gt3tool modcar` to the [reference] 0-60 and quarter mile
layout = I3
aspiration = TURBO
displacement = 660cc
; sound_id is left to the donor: its V6 sound bank is the closest available.

[drivetrain]
drive = MR                     ; Hijet layout: mid-engine, rear-wheel drive
gears = 3.45 1.95 1.30 0.98 0.80 0.75  ; 6-speed manual
final_drive = 5.20             ; sixth reaches the limiter at about 260 km/h; drag tops the car out nearer 230
reverse = 3.40

[tires]
; Hijet-style small van tyres: 145/80R12 = 12 x 25.4 + 2 x 145 x 0.80 = 537 mm across.
front = 145/80R12
rear = 145/80R12
grip_pct = 88                  ; fitted to the [reference] skidpad: at 100 % the donor's street tyres on
                               ; this wide car would hold 1.09 g, far more than a road car's 0.94

[model]
file = models/daihatsu_dumbo_r.glb ; our own body (wheels come from the engine: see below)
wheel = enw004_s        ; a dark multi-spoke rim from the disc (browse them with gt3r --browse wheel/)
lower_mm = 0                     ; fine-tune the body's height over the wheels if the arches look off

[paints]
Carmine Red = #9B1B24
Pearl White = #E7E5DF
Glacier Silver = #B8BCC0
Graphite Grey = #3B3E43
Midnight Blue = #1D2A4B
Solar Yellow = #E2B01C
British Racing Green = #004225
Burnt Orange = #CC5500
Hot Pink = #FF1493
Black = #111111

[dealer]
for_sale = yes                 ; at the GT3R dealer (Europe > Germany), for [car] price
description = The Daihatsu Dumbo was a boxy concept van based on the production HiJet mircovan. The compact car was first presented at the 1989 Tokyo Motor Show. Since the concept was originally sharpened to fit the norms of a kei car, it was based on the serial Hijet with a 660 cc engine.
picture = images/daihatsu_dumbo_r.png       ; 640x448, rendered with the game's car viewer (README.md "Pictures")
thumb = images/daihatsu_dumbo_r_thumb.png   ; 51x27: the dealer's strip button and the arcade picker's icon
; logo is left out: the dealer writes the name in the menu font instead

[arcade]
class = auto                   ; ranked by power-to-weight like the game's own cars
level = 0                      ; available from the start

[reference]
; Targets for a ~52 PS, 840 kg kei car (typical: 0-60 mph about 14 s, quarter mile about 19.5 s, 0.75-0.8 g).
; Only `gt3tool modcar` reads these: it prints its own results next to them.
zero_to_60_s = 14.0
quarter_mile_s = 19.5
top_speed_kmh = 140
skidpad_g = 0.78